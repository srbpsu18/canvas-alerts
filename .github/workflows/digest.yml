name: Canvas Digest

on:
  schedule:
    # All four crons cover both EST and EDT; the gate job skips the wrong one
    - cron: '0 12 * * *'   # 8am EDT
    - cron: '0 13 * * *'   # 8am EST
    - cron: '0 0 * * *'    # 8pm EDT
    - cron: '0 1 * * *'    # 8pm EST
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning or evening'
        default: 'morning'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Timezone gate
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ET_HOUR=$(TZ=America/New_York date +%H)
          if [ "$ET_HOUR" = "08" ]; then
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          elif [ "$ET_HOUR" = "20" ]; then
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping — ET hour is $ET_HOUR (expected 08 or 20)"
          fi

  digest:
    needs: gate
    if: needs.gate.outputs.mode != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          DIGEST_MODE: ${{ needs.gate.outputs.mode }}
        run: python canvas_alerts.py

      - name: Commit state
        run: |
          git config user.name "canvas-alerts[bot]"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
